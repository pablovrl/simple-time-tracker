<app-modal
  title="New task"
  [open]="true"
  [dismissible]="!saving()"
  (openChange)="!$event && closed.emit()"
>
  <form class="grid gap-5" [formGroup]="form" (ngSubmit)="create()" [attr.aria-busy]="saving()">
    <fieldset class="grid min-w-0 gap-5" [disabled]="saving()">
      <label class="flex flex-col gap-2 text-sm">
        Title
        <input
          class="min-h-11 rounded-control border border-control-border bg-surface px-3 text-foreground focus:border-focus focus:outline-none"
          formControlName="title"
          maxlength="255"
          required
          autofocus
          [attr.aria-invalid]="form.controls.title.touched && form.controls.title.invalid"
          aria-describedby="task-title-error"
        />
        @if (form.controls.title.touched && form.controls.title.invalid) {
          <span id="task-title-error" class="text-xs text-danger"
            >Enter a title of up to 255 characters.</span
          >
        }
      </label>
      <label class="flex flex-col gap-2 text-sm">
        Description (optional)
        <textarea
          class="rounded-control border border-control-border bg-surface px-3 py-2 text-foreground focus:border-focus focus:outline-none"
          formControlName="description"
          rows="3"
          maxlength="10000"
        ></textarea>
      </label>
      @if (loading()) {
        <p class="text-sm text-muted" role="status">Loading projects…</p>
      } @else if (loadError()) {
        <div>
          <p class="mb-3 text-sm text-danger" role="alert">Unable to load projects.</p>
          <button appButton type="button" (click)="loadProjects()">Try again</button>
        </div>
      } @else if (projects().length === 0) {
        <p class="text-sm text-muted">Create a project before adding a task.</p>
      } @else {
        <app-select
          label="Project"
          [options]="projects()"
          [value]="form.controls.projectId.value"
          [disabled]="saving()"
          (valueChange)="form.controls.projectId.setValue($event)"
        />
      }
    </fieldset>
    @if (error(); as message) {
      <p class="text-sm text-danger" role="alert">{{ message }}</p>
    }
    <div class="flex justify-end">
      <button
        appButton
        type="submit"
        [disabled]="saving() || loading() || loadError() || !projects().length"
      >
        {{ saving() ? 'Creating…' : 'Create task' }}
      </button>
    </div>
  </form>
</app-modal>
