<aside
  class="flex h-full flex-col gap-6 border-b border-border bg-surface p-6 md:min-h-dvh md:border-r md:border-b-0"
  aria-label="Account controls"
>
  <div class="flex flex-col gap-4 md:mt-auto">
    <app-theme-selector />
    <button appButton class="w-full" type="button" (click)="auth.logout()" [disabled]="auth.loggingOut()">
      {{ auth.loggingOut() ? 'Signing out…' : 'Sign out' }}
    </button>
    @if (auth.error(); as error) {
      <p class="mt-3 text-sm text-danger" role="alert">{{ error }}</p>
    }
  </div>
</aside>
