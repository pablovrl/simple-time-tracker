<aside
  class="flex h-full flex-col gap-6 bg-background px-6 pb-4 md:min-h-[calc(100dvh-6rem)] md:pr-0"
  aria-label="Account controls"
>
  <nav class="flex flex-col gap-2" aria-label="Main navigation">
    <a
      routerLink="/dashboard"
      routerLinkActive="bg-surface text-foreground shadow-sm"
      ariaCurrentWhenActive="page"
      class="flex items-center gap-3 rounded-control px-3 py-2.5 text-sm transition-colors hover:bg-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"
    >
      <svg lucideLayoutDashboard [size]="20"></svg>
      Dashboard
    </a>
    <a
      routerLink="/projects"
      routerLinkActive="bg-surface text-foreground shadow-sm"
      ariaCurrentWhenActive="page"
      class="flex items-center gap-3 rounded-control px-3 py-2.5 text-sm transition-colors hover:bg-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"
    >
      <svg lucideFolder [size]="20"></svg>
      Projects
    </a>
  </nav>
  <div class="flex flex-col gap-4 md:mt-auto">
    <app-theme-selector />
  </div>
</aside>
