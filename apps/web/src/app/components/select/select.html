<label>
  {{ label() }}
  <select
    #select
    class="ms-2 rounded border border-control-border bg-surface px-2.5 py-1.5 text-foreground enabled:hover:bg-surface-hover enabled:active:border-focus focus-visible:outline-2 focus-visible:outline-offset-3 focus-visible:outline-focus disabled:cursor-not-allowed disabled:opacity-60"
    [value]="value()"
    [disabled]="disabled()"
    (change)="valueChange.emit(select.value)"
  >
    @for (option of options(); track option.value) {
      <option [value]="option.value" [selected]="option.value === value()">
        {{ option.label }}
      </option>
    }
  </select>
</label>
