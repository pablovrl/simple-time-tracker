<label class="flex flex-col gap-2">
  <span class="text-xs text-muted">{{ label() }}</span>
  <span class="relative">
    <select
      #select
      class="min-h-11 w-full cursor-pointer appearance-none rounded-control border border-control-border bg-surface py-2.5 ps-3.5 pe-10 text-sm text-foreground transition-colors enabled:hover:bg-surface-hover enabled:active:border-focus focus-visible:outline-2 focus-visible:outline-offset-3 focus-visible:outline-focus disabled:cursor-not-allowed disabled:opacity-60"
      [value]="value()"
      [disabled]="disabled()"
      (change)="valueChange.emit(select.value)"
    >
      @for (option of options(); track option.value) {
        <option [value]="option.value" [selected]="option.value === value()">
          {{ option.label }}
        </option>
      }
    </select>
    <svg
      class="pointer-events-none absolute end-3 top-1/2 size-4 -translate-y-1/2 text-muted"
      [class.opacity-60]="disabled()"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <use href="svg/chevron-down.svg#icon" />
    </svg>
  </span>
</label>
