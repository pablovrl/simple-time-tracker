<label>
  {{ label() }}
  <select
    #select
    class="ms-2 rounded border border-border bg-surface px-2.5 py-1.5 text-foreground focus-visible:outline-2 focus-visible:outline-offset-3 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-60"
    [value]="value()"
    [disabled]="disabled()"
    (change)="valueChange.emit(select.value)"
  >
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
</label>
