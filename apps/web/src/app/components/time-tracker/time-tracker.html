<app-card class="px-4! py-2!">
  <div class="flex items-center gap-4">
    <span class="hidden min-w-0 truncate text-sm text-muted lg:inline">What are you working on?</span>
    <span class="ms-auto shrink-0 font-mono text-lg tabular-nums text-headline" aria-label="Elapsed time"
      >00:00:00</span
    >
    <button
      appButton
      class="inline-flex! size-10 shrink-0 items-center justify-center rounded-full! p-0!"
      type="button"
      aria-label="Start timer"
      title="Start timer"
    >
      <svg lucidePlay [size]="20"></svg>
    </button>
  </div>
</app-card>
