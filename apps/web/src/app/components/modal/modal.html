<dialog
  #dialog
  class="fixed inset-0 m-auto max-h-[calc(100dvh-3rem)] w-[calc(100%-3rem)] max-w-xl overflow-y-auto rounded-panel border-0 bg-surface p-6 text-foreground shadow-lg backdrop:bg-black/40 sm:p-8"
  [attr.aria-label]="title()"
  (cancel)="onCancel($event)"
  (close)="open.set(false)"
  (click)="onBackdropClick($event)"
>
  <div class="mb-6 flex items-center justify-between gap-4">
    <h2 class="text-xl font-semibold text-headline">{{ title() }}</h2>
    @if (dismissible()) {
      <button
        type="button"
        class="inline-flex size-9 shrink-0 cursor-pointer items-center justify-center rounded-control text-muted hover:bg-surface-hover hover:text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus"
        aria-label="Close modal"
        (click)="dismiss()"
      >
        <svg lucideX [size]="20"></svg>
      </button>
    }
  </div>
  <ng-content />
</dialog>
