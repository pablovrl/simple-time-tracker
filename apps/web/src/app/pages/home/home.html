<main class="grid min-h-dvh place-items-center p-6 text-center">
  <section aria-label="Your account">
    @if (auth.user(); as user) {
      <p>{{ user.name }}</p>
      <p>{{ user.email }}</p>
      <p><app-theme-selector /></p>
      <button appButton type="button" (click)="auth.logout()" [disabled]="auth.loggingOut()">
        {{ auth.loggingOut() ? 'Signing out…' : 'Sign out' }}
      </button>
    }
    @if (auth.error(); as error) {
      <p class="text-danger" role="alert">{{ error }}</p>
    }
  </section>
</main>
