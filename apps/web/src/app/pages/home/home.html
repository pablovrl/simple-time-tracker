<main>
  <section aria-label="Your account">
    @if (auth.user(); as user) {
      <p>{{ user.name }}</p>
      <p>{{ user.email }}</p>
      <button type="button" (click)="auth.logout()" [disabled]="auth.loggingOut()">
        {{ auth.loggingOut() ? 'Signing out…' : 'Sign out' }}
      </button>
    }
    @if (auth.error(); as error) {
      <p role="alert">{{ error }}</p>
    }
  </section>
</main>
