<main class="grid min-h-dvh place-items-center p-6 text-center">
  <section
    class="w-full max-w-sm rounded-panel border border-border bg-surface p-6 sm:p-8"
    aria-labelledby="login-title"
    [attr.aria-busy]="auth.loading()"
  >
    <svg
      class="mx-auto mb-6 size-10 text-headline"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <use href="svg/clock.svg#icon" />
    </svg>
    <h1 id="login-title" class="text-3xl font-semibold tracking-tight text-headline">
      Simple Time Tracker
    </h1>
    <p class="mt-3 text-sm leading-relaxed text-muted">Track your time. Keep it simple.</p>

    <div class="mt-8 min-h-28">
      @if (auth.loading()) {
        <p class="py-3 text-sm text-muted" role="status">Checking your session…</p>
      } @else if (auth.error(); as error) {
        <p class="mb-4 text-sm text-danger" role="alert">{{ error }}</p>
        <button appButton class="min-h-12 w-full" type="button" (click)="retry()">Try again</button>
      } @else {
        <a appButton class="min-h-12 w-full" [href]="auth.loginUrl">
          <span class="flex items-center justify-center gap-3">
            <svg class="size-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
              <use href="svg/google.svg#icon" />
            </svg>
            Continue with Google
          </span>
        </a>
      }
    </div>
  </section>
</main>
