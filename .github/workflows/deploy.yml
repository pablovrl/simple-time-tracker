name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_PROJECT: simple-time-tracker-514822
  GCP_REGION: southamerica-east1
  CLOUD_RUN_SERVICE: time-tracker-api
  IMAGE: southamerica-east1-docker.pkg.dev/simple-time-tracker-514822/simple-time-tracker/api

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm install --global npm@12.2.2
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:web
      - run: npm run build

      - name: Save production frontend
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend
          path: apps/web/dist/web/browser
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Do not interrupt a deploy after the API has been updated.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend
          path: apps/web/dist/web/browser

      - run: npm install --global firebase-tools@15.37.0

      # Build before creating Google credentials so they cannot enter the image.
      - name: Build API
        run: docker build -f apps/api/Dockerfile -t "$IMAGE:latest" .

      - name: Authenticate to Google Cloud without a service account key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: projects/101789988033/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deploy@simple-time-tracker-514822.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push latest image
        run: |
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE:latest"

      - name: Update Cloud Run
        run: |
          # Resolve the pushed image locally, not a mutable remote tag.
          DIGEST_IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:latest")
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT" \
            --region="$GCP_REGION" \
            --image="$DIGEST_IMAGE" \
            --quiet

      - name: Check API and database
        run: |
          SERVICE_URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT" --region="$GCP_REGION" \
            --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 5 --max-time 60 "$SERVICE_URL/api/health" \
            | jq -e '.status == "ok" and .database.status == "up"'

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project "$GCP_PROJECT" --non-interactive

      - name: Check Hosting API proxy
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 5 --max-time 60 \
            "https://$GCP_PROJECT.web.app/api/health" \
            | jq -e '.status == "ok" and .database.status == "up"'
